# Based on github.com/vossenwout/pookie-dotfiles

# --- Terminal ---
# Make colorschemes appear correctly
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm*:RGB'

# Correctly pass modified keys (e.g. Shift-Enter) to programs
set -g extended-keys on
set -g extended-keys-format csi-u

# Let programs copy to the system clipboard
set -g allow-passthrough on
set -s set-clipboard on

# Pass focus in/out events to programs (Claude Code, Neovim)
set -g focus-events on

# --- Prefix: Ctrl-Space ---
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- Panes ---
# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style splits, opened in the current folder
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# --- Windows ---
# c: new window right after the current one, C: new window at the end
bind c new-window -a -c "#{pane_current_path}"
bind C new-window -c "#{pane_current_path}"

# Move the current window left/right
bind -r Left swap-window -t -1 \; select-window -t -1
bind -r Right swap-window -t +1 \; select-window -t +1

# Number windows from 1 and renumber when one closes
set -g base-index 1
set -g renumber-windows on

# Name windows after the current folder instead of the program
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# --- Copy mode (Vim-style) ---
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection

# --- Agent notifications ---
# Underline a background window when a program in it rings the bell
setw -g monitor-bell on
set -g bell-action other
setw -g window-status-bell-style 'fg=#787487 underscore'

# --- Look (guts colors) ---
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=default'

set -g status-left ' '
set -g status-right ''

setw -g window-status-separator ' '
setw -g window-status-format ' #I #W #F '
setw -g window-status-style 'bg=default,fg=#787487'
setw -g window-status-current-format ' #I #W #F '
setw -g window-status-current-style 'bg=#c4c19b,fg=#101113,bold'

set -g pane-border-lines single
set -g pane-border-style 'fg=#554A62'
set -g pane-active-border-style 'fg=#787487'
setw -g mode-style 'fg=#a7d8b0'

# --- Nested sessions (e.g. tmux over SSH) ---
# Ctrl-` turns this tmux's keys off so they reach the inner one; press again to turn back on
bind -T root 'C-`' \
  set prefix None \;\
  set key-table off \;\
  setw -g window-status-style 'fg=#554a62' \;\
  setw -g window-status-current-style 'bg=default,fg=#554a62' \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S

bind -T off 'C-`' \
  set -u prefix \;\
  set -u key-table \;\
  setw -g window-status-style 'bg=default,fg=#787487' \;\
  setw -g window-status-current-style 'bg=#c4c19b,fg=#101113,bold' \;\
  refresh-client -S
